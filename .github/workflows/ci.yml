# Runs the code checks, calculation tests and database tests on every push and pull request.
# Phone-screen (Playwright) tests run locally before each stage sign-off (spec section 10).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Start local Supabase
        run: npx supabase start

      - name: Database tests
        run: npx supabase test db
